# Perfil local: roda na maquina do desenvolvedor contra os servicos de infra/local/compose.yaml (ADR_151).
# Credenciais abaixo sao apenas de desenvolvimento e batem com os padroes de infra/local/.env.example.
# Qualquer valor pode ser sobrescrito por variavel de ambiente (ex.: $env:MONGODB_URI no PowerShell).

# MongoDB (usuario da aplicacao criado por infra/local/mongo-init/01-create-app-user.js)
spring.mongodb.uri=${MONGODB_URI:mongodb://lhamalog:lhamalog@localhost:27017/lhamalog_collector?authSource=lhamalog_collector}

# Redis (Redis Streams)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Elasticsearch (sem seguranca no ambiente local)
spring.elasticsearch.uris=${ELASTICSEARCH_URIS:http://localhost:9200}

# OpenTelemetry Collector local (OTLP/HTTP na porta 4318).
# Sem o stack de observabilidade no ar? Desligue com OTLP_ENABLED=false.
management.otlp.metrics.export.url=${OTLP_METRICS_URL:http://localhost:4318/v1/metrics}
management.otlp.metrics.export.step=${OTLP_METRICS_STEP:30s}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACES_URL:http://localhost:4318/v1/traces}
management.tracing.sampling.probability=1.0

# Diagnostico local
management.endpoint.health.show-details=always
logging.level.br.com.lhamalog=DEBUG
