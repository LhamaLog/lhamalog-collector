# Perfil prod: todos os hosts e segredos vem de variaveis de ambiente (ADR_151).
# Nenhum host ou segredo fica no repositorio. Ative com SPRING_PROFILES_ACTIVE=prod.
#
# Obrigatorias: MONGODB_URI, REDIS_HOST, OPENOBSERVE_URL, OPENOBSERVE_USERNAME, OPENOBSERVE_PASSWORD,
#               OTLP_METRICS_URL, OTLP_TRACES_URL
# Opcionais:    SERVER_PORT (8080), REDIS_PORT (6379), REDIS_USERNAME, REDIS_PASSWORD, REDIS_SSL_ENABLED (false),
#               OPENOBSERVE_ORGANIZATION (lhamalog), OPENOBSERVE_LOGS_STREAM (logs), OPENOBSERVE_TRACES_STREAM (traces),
#               OTLP_RECEIVER_HTTP_PORT (4318), OTLP_RECEIVER_GRPC_PORT (4317),
#               OTLP_ENABLED (true), TRACING_SAMPLING_PROBABILITY (0.1)

# MongoDB
spring.mongodb.uri=${MONGODB_URI}

# Redis (fila de mensagens da Varredura; nao e destino do receptor OTLP)
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}

# Receptor OTLP nas portas padrao do protocolo
lhamalog.otlp.http.port=${OTLP_RECEIVER_HTTP_PORT:4318}
lhamalog.otlp.grpc.port=${OTLP_RECEIVER_GRPC_PORT:4317}

# OpenObserve (destino de logs e traces - ADR_168). Sem valor padrao de credencial.
lhamalog.otlp.openobserve.url=${OPENOBSERVE_URL}
lhamalog.otlp.openobserve.username=${OPENOBSERVE_USERNAME}
lhamalog.otlp.openobserve.password=${OPENOBSERVE_PASSWORD}

# OpenTelemetry (endpoint OTLP/HTTP do coletor de observabilidade do ambiente)
management.otlp.metrics.export.url=${OTLP_METRICS_URL}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACES_URL}
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}

# Sem detalhes internos no health em producao
management.endpoint.health.show-details=never
