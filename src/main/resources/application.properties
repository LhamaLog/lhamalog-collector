# Configuracao base, comum a todos os perfis (ADR_151).
# Valores especificos de ambiente ficam em application-local.properties e application-prod.properties.
spring.application.name=lhamalog-collector

# Perfil usado quando nenhum perfil e informado: local (maquina do desenvolvedor).
# Em producao o perfil e sempre explicito: SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=local

server.port=${SERVER_PORT:8080}

# Actuator: expoe apenas health e info pela web.
management.endpoints.web.exposure.include=health,info

# Exportacao OTLP (metricas e traces). Liga/desliga com a variavel OTLP_ENABLED.
management.otlp.metrics.export.enabled=${OTLP_ENABLED:true}
management.tracing.export.otlp.enabled=${OTLP_ENABLED:true}

# Receptor OTLP de logs e traces (LLT-181). Portas por perfil.
lhamalog.otlp.http.enabled=${OTLP_RECEIVER_HTTP_ENABLED:true}
lhamalog.otlp.http.host=${OTLP_RECEIVER_HTTP_HOST:0.0.0.0}
lhamalog.otlp.grpc.enabled=${OTLP_RECEIVER_GRPC_ENABLED:true}
lhamalog.otlp.grpc.host=${OTLP_RECEIVER_GRPC_HOST:0.0.0.0}
lhamalog.otlp.max-message-size=${OTLP_RECEIVER_MAX_MESSAGE_SIZE:64MB}

# OpenObserve: destino de logs e traces (ADR_168). Credencial so por variavel de ambiente.
lhamalog.otlp.openobserve.organization=${OPENOBSERVE_ORGANIZATION:lhamalog}
lhamalog.otlp.openobserve.logs-stream=${OPENOBSERVE_LOGS_STREAM:logs}
lhamalog.otlp.openobserve.traces-stream=${OPENOBSERVE_TRACES_STREAM:traces}

# Janela de horario aceita (FR-019): fora dela o registro e rejeitado no partial_success.
# Mantenha max-age abaixo do ZO_INGEST_ALLOWED_UPTO do OpenObserve (5h por padrao).
lhamalog.otlp.timestamp.max-age=${OTLP_RECEIVER_TIMESTAMP_MAX_AGE:290m}
lhamalog.otlp.timestamp.max-future=${OTLP_RECEIVER_TIMESTAMP_MAX_FUTURE:1h}

# Cache de tokens (FR-008): positivo para validos, negativo pequeno e curto para recusados.
lhamalog.otlp.token-cache.positive-ttl=${OTLP_RECEIVER_TOKEN_CACHE_TTL:30s}
lhamalog.otlp.token-cache.positive-max-size=${OTLP_RECEIVER_TOKEN_CACHE_MAX_SIZE:10000}
lhamalog.otlp.token-cache.negative-ttl=${OTLP_RECEIVER_NEGATIVE_TOKEN_CACHE_TTL:3s}
lhamalog.otlp.token-cache.negative-max-size=${OTLP_RECEIVER_NEGATIVE_TOKEN_CACHE_MAX_SIZE:1000}

# Limites do servidor HTTP do JDK (FR-025). Em producao use um proxy reverso na frente.
lhamalog.otlp.http-limits.max-concurrent-requests=${OTLP_RECEIVER_HTTP_MAX_CONCURRENT_REQUESTS:200}
lhamalog.otlp.http-limits.max-connections=${OTLP_RECEIVER_HTTP_MAX_CONNECTIONS:1000}
lhamalog.otlp.http-limits.read-timeout=${OTLP_RECEIVER_HTTP_READ_TIMEOUT:30s}
lhamalog.otlp.http-limits.write-timeout=${OTLP_RECEIVER_HTTP_WRITE_TIMEOUT:30s}
lhamalog.otlp.http-limits.idle-timeout=${OTLP_RECEIVER_HTTP_IDLE_TIMEOUT:30s}
lhamalog.otlp.http-limits.max-idle-connections=${OTLP_RECEIVER_HTTP_MAX_IDLE_CONNECTIONS:200}

# Mensageria Redis Streams (LLT-182 / LLT-184): MAXLEN ~ por stream e retry/DLQ na publicacao.
lhamalog.messaging.streams.default-max-len=${LHAMALOG_MESSAGING_STREAM_DEFAULT_MAX_LEN:100000}
lhamalog.messaging.streams.logs-max-len=${LHAMALOG_MESSAGING_STREAM_LOGS_MAX_LEN:100000}
lhamalog.messaging.streams.traces-max-len=${LHAMALOG_MESSAGING_STREAM_TRACES_MAX_LEN:100000}
lhamalog.messaging.streams.logs-dlq-max-len=${LHAMALOG_MESSAGING_STREAM_LOGS_DLQ_MAX_LEN:100000}
lhamalog.messaging.streams.traces-dlq-max-len=${LHAMALOG_MESSAGING_STREAM_TRACES_DLQ_MAX_LEN:100000}
lhamalog.messaging.publish.max-attempts=${LHAMALOG_MESSAGING_PUBLISH_MAX_ATTEMPTS:3}
lhamalog.messaging.publish.backoff-initial-ms=${LHAMALOG_MESSAGING_PUBLISH_BACKOFF_INITIAL_MS:100}
lhamalog.messaging.publish.backoff-multiplier=${LHAMALOG_MESSAGING_PUBLISH_BACKOFF_MULTIPLIER:2}
lhamalog.messaging.publish.backoff-ceiling-ms=${LHAMALOG_MESSAGING_PUBLISH_BACKOFF_CEILING_MS:2000}

# Uso por tenant/produto (LLT-186). O token do Core vem exclusivamente do ambiente.
lhamalog.usage.enabled=${LHAMALOG_USAGE_ENABLED:false}
lhamalog.usage.core.url=${LHAMALOG_USAGE_CORE_URL:http://localhost:8081}
lhamalog.usage.lease=${LHAMALOG_USAGE_LEASE:30s}
lhamalog.usage.worker-interval=${LHAMALOG_USAGE_WORKER_INTERVAL:10s}
lhamalog.usage.grace=${LHAMALOG_USAGE_GRACE:2m}
lhamalog.usage.deduplication-ttl=${LHAMALOG_USAGE_DEDUPLICATION_TTL:7d}
lhamalog.usage.backoff-initial=${LHAMALOG_USAGE_BACKOFF_INITIAL:250ms}
lhamalog.usage.backoff-ceiling=${LHAMALOG_USAGE_BACKOFF_CEILING:30s}
