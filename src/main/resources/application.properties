# Configuracao base, comum a todos os perfis (ADR_151).
# Valores especificos de ambiente ficam em application-local.properties e application-prod.properties.
spring.application.name=lhamalog-collector

# Perfil usado quando nenhum perfil e informado: local (maquina do desenvolvedor).
# Em producao o perfil e sempre explicito: SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=local

server.port=${SERVER_PORT:8080}

# Actuator: expoe apenas health e info pela web.
management.endpoints.web.exposure.include=health,info

# Exportacao OTLP (metricas e traces). Liga/desliga com a variavel OTLP_ENABLED.
management.otlp.metrics.export.enabled=${OTLP_ENABLED:true}
management.tracing.export.otlp.enabled=${OTLP_ENABLED:true}

# Receptor OTLP de logs e traces (LLT-181). Portas por perfil.
lhamalog.otlp.http.enabled=${OTLP_RECEIVER_HTTP_ENABLED:true}
lhamalog.otlp.http.host=${OTLP_RECEIVER_HTTP_HOST:0.0.0.0}
lhamalog.otlp.grpc.enabled=${OTLP_RECEIVER_GRPC_ENABLED:true}
lhamalog.otlp.grpc.host=${OTLP_RECEIVER_GRPC_HOST:0.0.0.0}
lhamalog.otlp.max-message-size=${OTLP_RECEIVER_MAX_MESSAGE_SIZE:64MB}

# OpenObserve: destino de logs e traces (ADR_168). Credencial so por variavel de ambiente.
lhamalog.otlp.openobserve.organization=${OPENOBSERVE_ORGANIZATION:lhamalog}
lhamalog.otlp.openobserve.logs-stream=${OPENOBSERVE_LOGS_STREAM:logs}
lhamalog.otlp.openobserve.traces-stream=${OPENOBSERVE_TRACES_STREAM:traces}
