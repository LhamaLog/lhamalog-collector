# Configuracao base, comum a todos os perfis (ADR_151).
# Valores especificos de ambiente ficam em application-local.properties e application-prod.properties.
spring.application.name=lhamalog-collector

# Perfil usado quando nenhum perfil e informado: local (maquina do desenvolvedor).
# Em producao o perfil e sempre explicito: SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=local

server.port=${SERVER_PORT:8080}

# Actuator: expoe apenas health e info pela web.
management.endpoints.web.exposure.include=health,info

# Exportacao OTLP (metricas e traces). Liga/desliga com a variavel OTLP_ENABLED.
management.otlp.metrics.export.enabled=${OTLP_ENABLED:true}
management.tracing.export.otlp.enabled=${OTLP_ENABLED:true}

# Receptores OTLP (LLT-181): OTLP/HTTP (POST /v1/logs e /v1/traces) e OTLP/gRPC (LogsService e TraceService).
# Portas padrao da especificacao OTLP: 4318 (HTTP) e 4317 (gRPC). Servidores separados do server.port (8080).
lhamalog.otlp.http.enabled=${OTLP_RECEIVER_HTTP_ENABLED:true}
lhamalog.otlp.http.port=${OTLP_RECEIVER_HTTP_PORT:4318}
lhamalog.otlp.http.max-request-size=${OTLP_RECEIVER_MAX_REQUEST_SIZE:4MB}
lhamalog.otlp.grpc.enabled=${OTLP_RECEIVER_GRPC_ENABLED:true}
lhamalog.otlp.grpc.port=${OTLP_RECEIVER_GRPC_PORT:4317}
lhamalog.otlp.grpc.max-message-size=${OTLP_RECEIVER_MAX_REQUEST_SIZE:4MB}
# PROVISORIO (LLT-181): tokens de API por propriedade (lista separada por virgula), ate a validacao no MongoDB.
lhamalog.otlp.auth.valid-tokens=${OTLP_VALID_TOKENS:}
lhamalog.otlp.auth.revoked-tokens=${OTLP_REVOKED_TOKENS:}
