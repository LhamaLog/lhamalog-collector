# Railway (LLT-187). Single-tenant, auth_enabled: false: acceptable only because the loki service has
# no public domain and is reachable only over the project's private network (loki.railway.internal).
# Never generate a public domain or TCP proxy for this service.
auth_enabled: false

server:
  http_listen_address: "::"
  http_listen_port: 3100
  grpc_listen_address: "::"
  grpc_listen_port: 9095

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  retention_period: 168h

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  delete_request_store: filesystem
