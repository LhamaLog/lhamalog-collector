global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: lhamalog-collector
    metrics_path: /actuator/prometheus
    static_configs:
      # Default MANAGEMENT_PORT=9464. If you change the port, edit this target to match.
      - targets:
          - host.docker.internal:9464
        labels:
          service: lhamalog-collector

  # Outros módulos (Core, Varredura, Finder, Ocorrência) ainda não expõem /actuator/prometheus.
  # Quando expuserem, adicione um job por módulo (o dashboard 'Métricas por módulo' usa estes nomes):
  # - job_name: lhamalog-core
  #   metrics_path: /actuator/prometheus
  #   static_configs:
  #     - targets: [host.docker.internal:<porta-de-management>]
  # (lhamalog-varredura, lhamalog-finder, lhamalog-ocorrencia: idem)
